  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(rgba(10,10,10,.16) 1.2px, transparent 1.3px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  input { -webkit-user-select: text; user-select: text; }

  main {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .screen {
    width: 100%; max-width: 440px;
    display: flex; flex-direction: column; gap: 20px;
    animation: enter .35s ease both;
  }
  .screen[hidden] { display: none; }
  .center { text-align: center; align-items: center; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-transform: uppercase; overflow-wrap: anywhere; }
  .gift { font-size: clamp(96px, 30vw, 128px); line-height: 1; margin-bottom: 4px; }
  h1 { font-size: clamp(32px, 10.5vw, 44px); line-height: 1.15; }
  h2 { font-size: clamp(26px, 8vw, 34px); line-height: 1.2; }
  p { margin: 0; color: var(--muted); font-weight: 500; }
  .big-emoji { font-size: 64px; line-height: 1; }

  .kicker {
    display: inline-block; padding: 9px 18px;
    font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    background: var(--yellow); color: var(--ink);
    border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: 0 4px 0 var(--ink);
  }

  .btn {
    appearance: none; cursor: pointer; width: 100%;
    min-height: 62px; padding: 14px 24px;
    border: 3px solid var(--ink); border-radius: var(--radius);
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 800; font-size: 16px; letter-spacing: .06em; text-transform: uppercase;
    box-shadow: var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease, opacity .2s ease;
    overflow-wrap: anywhere;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }

  /* Configuración */
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 3px solid var(--ink); border-radius: var(--radius-box);
    box-shadow: var(--shadow);
    padding: 8px;
  }
  .stepper .label { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 12.5px; }
  .stepper .label small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; text-transform: none; letter-spacing: 0; }
  .stepper .ctrl { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer;
    background: var(--accent); color: var(--ink); font: inherit; font-size: 22px; font-weight: 800; line-height: 1;
    box-shadow: 0 3px 0 var(--ink); transition: transform .1s, box-shadow .1s;
  }
  .stepper button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .stepper button:disabled { opacity: .35; }
  .stepper output { min-width: 38px; text-align: center; font-family: var(--display); font-size: 34px; }
  .stepper .label { padding-left: 8px; }
  .stepper .ctrl { gap: 2px; }
  .stepper output { min-width: 32px; }

  .names { display: flex; flex-direction: column; gap: 12px; }
  .names input {
    width: 100%; height: 56px; padding: 0 20px;
    border: 3px solid var(--ink); border-radius: var(--radius);
    background: var(--card); color: var(--ink); font: inherit; font-size: 17px; font-weight: 600;
    outline: none; transition: box-shadow .15s, background .15s;
  }
  .names input::placeholder { color: #a39da8; font-weight: 500; }
  .names input:focus { box-shadow: 0 4px 0 var(--purple); }
  .names input.bad { background: #fbe3ee; box-shadow: 0 4px 0 var(--danger); }
  #s-setup { padding-bottom: 130px; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 28px max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: linear-gradient(to top, var(--bg) 62%, rgba(252,251,247,0));
    pointer-events: none;
  }
  .dock[hidden] { display: none; }
  .dock > * { pointer-events: auto; width: 100%; max-width: 440px; }
  @media (min-width: 700px) { .dock > * { max-width: 500px; } }
  .error { min-height: 22px; color: var(--danger); font-size: 15px; font-weight: 700; text-align: center; }

  /* Dado y resultado */
  .dice { font-size: 84px; line-height: 1; display: inline-block; }
  .dice.roll { animation: roll .55s linear infinite; }
  @keyframes roll {
    0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } 100% { transform: rotate(360deg) scale(1); }
  }
  .shuffle {
    font-family: var(--display); text-transform: uppercase;
    font-size: clamp(26px, 8vw, 34px); line-height: 1.25;
    color: var(--purple); min-height: 1.6em; overflow-wrap: anywhere;
  }
  .result-name {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(44px, 14vw, 72px); line-height: 1.1;
    text-transform: uppercase; color: var(--purple); overflow-wrap: anywhere;
    padding: 14px 4px; width: 100%;
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .result-name.long { font-size: clamp(32px, 10vw, 50px); }
  .result-name.xlong { font-size: clamp(24px, 7vw, 34px); }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  .secret {
    background: var(--yellow); border: 3px solid var(--ink); border-radius: var(--radius-box);
    box-shadow: 0 4px 0 var(--ink); padding: 14px 18px; color: var(--ink); font-weight: 700;
  }
  #result-lead { color: var(--ink); font-size: 19px; font-weight: 800; }

  .progress { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .progress i { width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--ink); }
  .progress i.on { background: var(--purple); }

  @media (min-width: 700px) { body { font-size: 18px; } .screen { max-width: 500px; } }
  @media (max-height: 560px) { .big-emoji { font-size: 44px; } .dice { font-size: 60px; } .screen { gap: 12px; } }
  @media (prefers-reduced-motion: reduce) {
    .screen, .result-name { animation: none; }
    .dice.roll { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
<main>

  <!-- 1. Configuración -->
  <section id="s-setup" class="screen">
    <div class="center" style="display:flex;flex-direction:column;gap:12px;align-items:center">
      <div class="gift" aria-hidden="true">🎁</div>
      <h1>Amigo Invisible</h1>
      <p>Organiza tu amigo invisible en segundos.</p>
    </div>

    <div class="stepper">
      <div class="label">Participantes<small>Mínimo 3</small></div>
      <div class="ctrl">
        <button type="button" id="minus" aria-label="Quitar un participante">−</button>
        <output id="count" aria-live="polite">3</output>
        <button type="button" id="plus" aria-label="Añadir un participante">+</button>
      </div>
    </div>

    <form id="form" class="screen" style="animation:none;max-width:none;gap:14px" novalidate autocomplete="off">
      <div class="names" id="names"></div>
    </form>
  </section>

  <!-- 2. Turno -->
  <section id="s-turn" class="screen center" hidden>
    <div class="kicker" id="turn-count"></div>
    <div class="big-emoji">📱</div>
    <h2 id="turn-title"></h2>
    <p id="turn-text"></p>
    <button class="btn" id="roll" type="button"></button>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </section>

  <!-- 3. Descubrimiento -->
  <section id="s-reveal" class="screen center" hidden>
    <div id="rolling" class="screen center" style="animation:none;max-width:none">
      <div class="dice roll">🎲</div>
      <div class="shuffle" id="shuffle" aria-hidden="true"></div>
    </div>
    <div id="result" class="screen center" style="animation:none;max-width:none" hidden>
      <p id="result-lead" style="color:var(--ink);font-size:20px;font-weight:600"></p>
      <div class="result-name" id="result-name"></div>
      <div class="secret">¡Es un secreto! 🤫 No se lo digas a nadie.</div>
      <button class="btn dark" id="hide" type="button">Ocultar resultado 🔒</button>
    </div>
  </section>

  <!-- 5. Fin -->
  <section id="s-done" class="screen center" hidden>
    <div class="big-emoji">🎉</div>
    <h2>¡Amigo Invisible organizado!</h2>
    <p>Todos tienen ya a quién hacer su regalo.</p>
    <p>Ahora solo queda mantener el secreto y preparar los regalos.</p>
    <button class="btn" id="again" type="button">Crear otro sorteo</button>
  </section>

</main>

<!-- Botón fijo: fuera de las pantallas animadas para que position:fixed funcione -->
<div class="dock" id="dock">
  <div class="error" id="error" role="alert"></div>
  <button class="btn" type="submit" form="form">Empezar sorteo</button>
</div>

<script>
(() => {
  'use strict';

  /* <algo> */
  // Entero uniforme en [0, n) con crypto.getRandomValues (rejection sampling, sin sesgo de módulo).
  function randInt(n) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  // Fisher-Yates con aleatoriedad segura.
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  // Permutación sin puntos fijos, uniforme sobre todos los desarreglos:
  // se genera una permutación uniforme y se repite si alguien se queda consigo mismo (~e intentos de media).
  function derangement(n) {
    const p = Array.from({ length: n }, (_, i) => i);
    for (;;) {
      shuffle(p);
      if (p.every((v, i) => v !== i)) return p;
    }
  }
  /* </algo> */

  const $ = (id) => document.getElementById(id);
  const MIN = 3, MAX = 30, MAXLEN = 30;
  const screens = ['s-setup', 's-turn', 's-reveal', 's-done'];

  // Estado solo en memoria.
  let names = [];          // nombres en orden de introducción
  let assign = null;       // assign[i] = índice de a quién regala i
  let turn = 0;            // participante actual
  let phase = 'setup';     // setup | turn | rolling | result | done
  let timer = null, cycle = null;
  let draft = ['', '', ''];
  let readyAt = 0;         // evita que un doble toque en «Ocultar» active el dado del siguiente

  function show(id) {
    screens.forEach((s) => { $(s).hidden = s !== id; });
    $('dock').hidden = id !== 's-setup';
  }

  /* ---------- Configuración ---------- */
  function renderInputs() {
    const box = $('names');
    box.textContent = '';
    draft.forEach((v, i) => {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = v; inp.maxLength = MAXLEN;
      inp.placeholder = 'Nombre ' + (i + 1);
      inp.setAttribute('aria-label', 'Nombre del participante ' + (i + 1));
      inp.autocomplete = 'off'; inp.autocapitalize = 'words'; inp.spellcheck = false;
      inp.enterKeyHint = i === draft.length - 1 ? 'done' : 'next';
      inp.addEventListener('input', () => {
        draft[i] = inp.value; inp.classList.remove('bad'); $('error').textContent = '';
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && i < draft.length - 1) {
          e.preventDefault(); box.children[i + 1].focus();
        }
      });
      box.appendChild(inp);
    });
    $('count').textContent = draft.length;
    $('minus').disabled = draft.length <= MIN;
    $('plus').disabled = draft.length >= MAX;
  }
  function resize(delta) {
    const n = Math.min(MAX, Math.max(MIN, draft.length + delta));
    if (n === draft.length) return;
    if (n > draft.length) { while (draft.length < n) draft.push(''); }
    else draft.length = n;
    renderInputs();
  }
  const norm = (s) => s.normalize('NFC').trim().replace(/\s+/g, ' ');
  const key = (s) => norm(s).toLocaleLowerCase('es');

  function validate() {
    const inputs = [...$('names').children];
    inputs.forEach((i) => i.classList.remove('bad'));
    if (draft.length < MIN) return 'Se necesitan al menos 3 participantes.';
    const empty = draft.findIndex((v) => !norm(v));
    if (empty >= 0) { inputs[empty].classList.add('bad'); inputs[empty].focus(); return 'Falta algún nombre.'; }
    const seen = new Map();
    for (let i = 0; i < draft.length; i++) {
      const k = key(draft[i]);
      if (seen.has(k)) {
        inputs[i].classList.add('bad'); inputs[seen.get(k)].classList.add('bad'); inputs[i].focus();
        return 'Hay nombres repetidos: «' + norm(draft[i]) + '».';
      }
      seen.set(k, i);
    }
    return '';
  }

  function start(e) {
    e.preventDefault();
    if (phase !== 'setup') return;
    const err = validate();
    $('error').textContent = err;
    if (err) return;
    names = draft.map(norm);
    assign = derangement(names.length);   // todo el sorteo se decide aquí, una sola vez
    turn = 0;
    document.activeElement && document.activeElement.blur();
    showTurn();
  }

  /* ---------- Turnos ---------- */
  function showTurn() {
    phase = 'turn';
    const n = names.length, name = names[turn];
    $('turn-count').textContent = 'Turno ' + (turn + 1) + ' de ' + n;
    $('turn-title').textContent = turn === 0 ? 'Es el turno de ' + name : 'Ahora le toca a ' + name;
    $('turn-text').textContent = turn === 0
      ? 'Pásale el móvil a ' + name + ' para que descubra a quién tiene que hacer su regalo.'
      : 'Pásale el móvil a ' + name + '.';
    $('roll').textContent = turn === 0 ? '🎲 Descubrir mi amigo invisible' : 'Soy ' + name + ' — descubrir 🎲';
    $('roll').disabled = false;
    readyAt = Date.now() + 700;
    const p = $('progress'); p.textContent = '';
    for (let i = 0; i < n; i++) { const d = document.createElement('i'); if (i <= turn) d.className = 'on'; p.appendChild(d); }
    clearResult();
    show('s-turn');
    window.scrollTo(0, 0);
  }

  function clearResult() {
    clearTimeout(timer); clearInterval(cycle); timer = cycle = null;
    $('result-name').textContent = '';
    $('result-name').className = 'result-name';
    $('result-lead').textContent = '';
    $('shuffle').textContent = '';
    $('result').hidden = true;
    $('rolling').hidden = false;
  }

  function roll() {
    if (phase !== 'turn' || Date.now() < readyAt) return;   // ignora pulsaciones repetidas
    phase = 'rolling';
    $('roll').disabled = true;
    $('result').hidden = true; $('rolling').hidden = false;
    show('s-reveal');
    const sh = $('shuffle');
    const tick = () => { sh.textContent = names[randInt(names.length)]; };
    tick(); cycle = setInterval(tick, 90);
    timer = setTimeout(reveal, 1500);
  }

  function reveal() {
    clearInterval(cycle); cycle = null;
    if (phase !== 'rolling') return;
    phase = 'result';
    const target = names[assign[turn]];     // resultado ya fijado en el sorteo
    $('result-lead').textContent = '🎁 ' + names[turn] + ', te toca regalar a…';
    const out = $('result-name');
    out.textContent = target;
    if (target.length > 16) out.classList.add('xlong');
    else if (target.length > 8) out.classList.add('long');
    $('rolling').hidden = true; $('result').hidden = false;
  }

  function hideResult() {
    if (phase !== 'result') return;        // evita doble pulsación
    clearResult();
    if (turn + 1 < names.length) { turn++; showTurn(); } else finish();
  }

  // Si se pierde la visibilidad con un resultado a la vista, se oculta y se vuelve a la pantalla neutra
  // del mismo turno (el resultado sigue siendo el mismo al volver a pulsar el dado).
  function privacyGuard() {
    if (phase === 'result' || phase === 'rolling') showTurn();
  }

  function finish() {
    phase = 'done';
    assign = null; names = [];             // ya no hace falta nada en memoria
    show('s-done');
  }

  function reset() {
    if (phase !== 'done') return;
    phase = 'setup';
    draft = ['', '', ''];
    $('error').textContent = '';
    renderInputs();
    show('s-setup');
    window.scrollTo(0, 0);
  }

  /* ---------- Eventos ---------- */
  $('minus').addEventListener('click', () => resize(-1));
  $('plus').addEventListener('click', () => resize(1));
  $('form').addEventListener('submit', start);
  $('roll').addEventListener('click', roll);
  $('hide').addEventListener('click', hideResult);
  $('again').addEventListener('click', reset);

  document.addEventListener('visibilitychange', () => { if (document.hidden) privacyGuard(); });
  window.addEventListener('pagehide', privacyGuard);
  window.addEventListener('blur', privacyGuard);

  // Botón «Atrás»: se neutraliza para que no se pueda volver a ver nada.
  history.replaceState({ ai: 0 }, '', location.href);
  history.pushState({ ai: 1 }, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState({ ai: 1 }, '', location.href);
    privacyGuard();
  });
  // Si la página vuelve desde la caché del navegador (bfcache), se reinicia limpia.
  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  draft = ['', '', ''];

  renderInputs();
  show('s-setup');
})();
</script>
</body>
</html>
